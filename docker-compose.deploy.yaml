# Самостоятельный серверный стек. Не объединять с локальным docker-compose.yaml.
name: sabacc-server

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:14.8-alpine3.18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте пароль БД в .env}
      POSTGRES_DB: ${POSTGRES_DB:-sabacc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging

  backend:
    image: sabacc-backend:${RELEASE_TAG:-local}
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Задайте пароль БД в .env}
      SPRING_DATASOURCE_DATABASE_HOST: postgres
      SPRING_DATASOURCE_DATABASE_NAME: ${POSTGRES_DB:-sabacc}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      APP_ORIGIN: ${APP_ORIGIN:?Задайте origin с протоколом в .env}
      CRON_USER_CLEANUP: "${CRON_USER_CLEANUP:-0 */30 * * * *}"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:+ExitOnOutOfMemoryError"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 6
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    logging: *logging

  nginx:
    image: sabacc-web:${RELEASE_TAG:-local}
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_URL: /api
    ports:
      # TLS завершается внешним reverse proxy на том же хосте.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    volumes:
      - ./app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
