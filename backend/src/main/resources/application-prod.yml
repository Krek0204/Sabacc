# Один origin с протоколом и портом, без завершающего слэша.
server:
  host: "${SERVER_HOST:0.0.0.0}"
  protocol: "${SERVER_PROTOCOL:http}"

websocket:
  logging: false
  stomp:
    endpoint: "/ws"
    allowed-origin: "${APP_ORIGIN:http://localhost}"
    allowed-origin-patterns: "${APP_ORIGIN:http://localhost}"
    sock-js-enabled: true
  game:
    endpoint: "/game"
    allowed-origin: "${APP_ORIGIN:http://localhost}"
    allowed-origin-patterns: "${APP_ORIGIN:http://localhost}"
    sock-js-enabled: true
  broker:
    destination-prefixes:
      - "/topic"
      - "/queue"
      - "/input"
    application-destination-prefixes:
      - "/app"
    user-destination-prefixes: "/user"

security:
  cors:
    allowed-origin: "${APP_ORIGIN:http://localhost}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
