services:
  postgres:
    image: postgres:14.8-alpine3.18
    container_name: sabacc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sabacc}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sabacc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: sabacc-backend:local
    build:
      context: ./backend
    container_name: sabacc_backend
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DATABASE_HOST: postgres
      SPRING_DATASOURCE_DATABASE_NAME: ${POSTGRES_DB:-sabacc}
      SERVER_HOST: 0.0.0.0
      SERVER_PROTOCOL: http
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      CRON_USER_CLEANUP: "${CRON_USER_CLEANUP:-0 */30 * * * *}"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 20
    restart: unless-stopped

  nginx:
    image: sabacc-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: sabacc_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/game/info"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
